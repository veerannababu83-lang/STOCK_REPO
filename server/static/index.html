<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stock Charts</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0
    }

    html,
    body {
      height: 100%;
      background: #0f1216;
      color: #e6e9ee;
      font-family: Roboto, Arial, sans-serif;
      overflow: hidden
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1vh 1vw;
      gap: .8vh
    }

    .bar {
      height: 4vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 2vh;
      color: #8b94a1;
      gap: 2vw
    }

    .status {
      color: #8b94a1;
      text-align: right;
      max-width: 55vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .dots {
      display: flex;
      gap: .7vw
    }

    .dot {
      width: 1.5vh;
      height: 1.5vh;
      border-radius: 50%;
      background: #333b46
    }

    .dot.on {
      background: #5b9cf5
    }

    .pages {
      flex: 1;
      min-height: 0;
      position: relative
    }

    .page {
      display: none;
      height: 100%;
      gap: .8vh .6vw;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-template-rows: repeat(var(--rows), 1fr);
      --p: min(calc(16vw / var(--cols)), calc(30vh / var(--rows)))
    }

    .page.on {
      display: grid
    }

    .cell {
      min-height: 0;
      min-width: 0;
      background: #0b0e12;
      border: 2px solid #1c222b;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: .6vh;
      text-align: center;
      padding: 0 .5vw
    }

    .cell.up {
      border-color: #1f5c55
    }

    .cell.dn {
      border-color: #6b2a2a
    }

    .name {
      font-size: calc(var(--p) * .38);
      font-weight: 600;
      color: #c9d1db;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%
    }

    .price {
      font-size: var(--p);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.02em
    }

    .pct {
      font-size: calc(var(--p) * .62);
      font-weight: 700;
      line-height: 1.05
    }

    .chg {
      font-size: calc(var(--p) * .3);
      font-weight: 500;
      color: #8b94a1
    }

    .up .price,
    .up .pct {
      color: #26a69a
    }

    .dn .price,
    .dn .pct {
      color: #ef5350
    }

    .cell.none .price {
      font-size: calc(var(--p) * .4);
      color: #8b94a1
    }

    #msg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5vh;
      color: #8b94a1;
      text-align: center;
      padding: 4vw
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="bar"><span id="t">Starting…</span><span class="status" id="status"></span><span class="dots"
        id="d"></span></div>
    <div class="pages" id="p">
      <div id="msg">Connecting to market data…</div>
    </div>
  </div>
  <script>
    var K = new URLSearchParams(location.search).get("k") || "";
    var tiles = {}, prev = {}, last = {}, pg = [], cur = 0, built = false, lastT = 0, barT = 0;
    function $(i) { return document.getElementById(i) }
    function msg(t) { var m = $("msg"); if (m) m.textContent = t }
    function getData() { return fetch("/api/candles?k=" + encodeURIComponent(K)).then(function (r) { if (r.status == 403) { msg("Access denied: check the key in the app URL"); throw 403 } if (!r.ok) throw r.status; return r.json() }) }
    function pollStatus() {
      fetch("/api/status?k=" + encodeURIComponent(K)).then(function (r) { if (!r.ok) throw r.status; return r.json() }).then(function (s) {
        var el = $("status"); if (el) el.textContent = (s.state === "ready" ? "● " : "• ") + s.message;
        if (!built && s.message) msg(s.message);
      }).catch(function () { });
    }
    setInterval(pollStatus, 3000); pollStatus();
    function start() { getData().then(function (d) { build(d); connect() }).catch(function () { setTimeout(start, 3000) }) }
    function paint(s) {
      var t = tiles[s], p = last[s], pc = prev[s]; if (!t) return;
      if (p == null) { t.el.className = "cell none"; t.p.textContent = "NO DATA"; t.c.textContent = "check symbol: " + s; t.a.textContent = ""; return }
      t.p.textContent = p.toFixed(2);
      if (pc) {
        var d = p - pc, ch = d / pc * 100, up = d >= 0;
        t.c.textContent = (up ? "▲ +" : "▼ ") + ch.toFixed(2) + "%"; t.a.textContent = (up ? "+" : "") + d.toFixed(2);
        t.el.className = "cell " + (up ? "up" : "dn")
      }
      else { t.c.textContent = ""; t.a.textContent = ""; t.el.className = "cell" }
    }
    function build(d) {
      if (built) return; built = true; var P = $("p"), D = $("d"); P.innerHTML = "";
      d.pages.forEach(function (syms, i) {
        var n = syms.length, cols = n <= 4 ? 2 : (n <= 6 ? 3 : 4), rows = Math.ceil(n / cols);
        var el = document.createElement("div"); el.className = "page" + (i == 0 ? " on" : "");
        el.style.setProperty("--cols", cols); el.style.setProperty("--rows", rows); P.appendChild(el); pg.push(el);
        var dot = document.createElement("span"); dot.className = "dot" + (i == 0 ? " on" : ""); D.appendChild(dot);
        syms.forEach(function (s) {
          var c = document.createElement("div"); c.className = "cell";
          var nm = document.createElement("div"); nm.className = "name"; nm.textContent = (d.labels && d.labels[s]) || s;
          var p = document.createElement("div"); p.className = "price"; var pc = document.createElement("div"); pc.className = "pct"; var a = document.createElement("div"); a.className = "chg";
          c.appendChild(nm); c.appendChild(p); c.appendChild(pc); c.appendChild(a); el.appendChild(c);
          tiles[s] = { el: c, p: p, c: pc, a: a }; setData(s, d);
        });
      });
      upBar();
    }
    function setData(s, d) {
      var cd = d.candles[s] || []; prev[s] = d.prev ? d.prev[s] : null;
      last[s] = cd.length ? cd[cd.length - 1].close : null; paint(s);
    }
    function upBar() {
      var t = "Screen " + (cur + 1) + " of " + pg.length + "   ◀ ▶ to switch";
      if (lastT) { var x = new Date((lastT + 19800) * 1000), z = function (v) { return (v < 10 ? "0" : "") + v }; t += "   last tick " + z(x.getUTCHours()) + ":" + z(x.getUTCMinutes()) + ":" + z(x.getUTCSeconds()) + " IST" }
      $("t").textContent = t;
    }
    function go(n) {
      if (!pg.length) return; cur = (cur + n + pg.length) % pg.length;
      pg.forEach(function (e, i) { e.className = "page" + (i == cur ? " on" : "") });
      var ds = $("d").children; for (var i = 0; i < ds.length; i++)ds[i].className = "dot" + (i == cur ? " on" : ""); upBar();
    }
    document.addEventListener("keydown", function (e) {
      var k = e.keyCode;
      if (k == 39 || k == 40 || k == 22) { go(1); e.preventDefault() } else if (k == 37 || k == 38 || k == 21) { go(-1); e.preventDefault() }
    });
    function tick(m) {
      if (!tiles[m.s]) return; last[m.s] = m.p; paint(m.s);
      lastT = Math.floor(Date.now() / 1000); if (Date.now() - barT > 1000) { barT = Date.now(); upBar() }
    }
    function refreshHistory(w) {
      getData().then(function (d) {
        if (w.readyState !== 1) return;
        Object.keys(tiles).forEach(function (s) { setData(s, d) });
      }).catch(function () { if (w.readyState === 1) setTimeout(function () { refreshHistory(w) }, 3000) });
    }
    function connect() {
      var w = new WebSocket((location.protocol == "https:" ? "wss://" : "ws://") + location.host + "/ws?k=" + encodeURIComponent(K));
      w.onopen = function () { refreshHistory(w) };
      w.onmessage = function (e) { tick(JSON.parse(e.data)) };
      w.onclose = function () { setTimeout(connect, 3000) };
    }
    start();
  </script>
</body>

</html>
